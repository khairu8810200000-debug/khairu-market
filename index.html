<!doctype html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#147d55">
<title>Khairu Market — Jual Beli Malaysia</title>
<style>
#startup-status{font-family:system-ui,Arial,sans-serif;background:#e9f7ef;color:#145c3c;padding:20px;margin:18px auto;max-width:680px;border-radius:14px}
#startup-status a{color:#086b47}#startup-status button{padding:12px 16px;background:#087b50;color:#fff;border:0;border-radius:8px}
</style>
<script>
window.__khairuBooted=false;
window.addEventListener('error',function(e){var s=document.getElementById('startup-status');if(s){s.style.display='block';s.innerHTML='<strong>Khairu Market: masalah memuatkan aplikasi.</strong><p id="startup-error"></p><a href="./semak.html">Semak sambungan website</a>';document.getElementById('startup-error').textContent=e.message||'Ralat JavaScript';}});
window.addEventListener('unhandledrejection',function(e){var s=document.getElementById('startup-status');if(s&&!window.__khairuBooted){s.style.display='block';s.textContent='Khairu Market gagal dimuatkan: '+String(e.reason?.message||e.reason||'Ralat tidak diketahui');}});
</script>
</head>
<body>
<div id="startup-status">
<strong>🛍️ Khairu Market</strong>
<p>Website sedang dimuatkan. Jika paparan tidak berubah, tekan Muat Semula atau buka halaman ujian.</p>
<button onclick="location.reload()">Muat Semula</button>
<p><a href="./semak.html">Buka halaman ujian</a></p>
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
